name: build-jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # If you uploaded the ZIP itself, unpack it into the repo root.
      # If you uploaded the extracted folder contents, this step is skipped.
      - name: Unpack project zip (if present)
        run: |
          if [ -f PlantMegaPack-mikexxx-port-1_20_1.zip ]; then
            unzip -q -o PlantMegaPack-mikexxx-port-1_20_1.zip
          fi
          test -f build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PlantMegaPack-mikexxx-port-jar
          path: build/libs/*.jar
          if-no-files-found: error
